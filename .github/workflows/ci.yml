name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: false

      - name: Tool versions
        run: |
          go version
          docker version
          docker compose version

      - name: scripts/ci.sh
        run: scripts/ci.sh
